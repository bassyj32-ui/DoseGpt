name: Deploy Web

# Publishes the PWA to Vercel.
#
# Replaces the previous Netlify job. The repo homepage pointed at
# dose-gpt.vercel.app while CI published to Netlify, so the linked URL 404'd
# and any branch could produce two conflicting deployments. One host, one
# deploy path.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# Vercel skips its own build when this flag is set, so only one build runs.
concurrency:
  group: vercel-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # A pull request builds to prove it compiles, but must not deploy.
    # Production deploys come from master only.
    if: github.event_name != 'pull_request'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.7"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - name: Verify before deploying
        # A clinical reference should not ship if analysis or the dose
        # suite has regressed. Cheap, and it gates what users actually see.
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prebuilt --prod'

  verify-web-build:
    # Pull requests still build the site, so a broken web build is caught in
    # review rather than after merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.7"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - run: flutter build web --release

      - name: Confirm the PWA is intact
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/manifest.json
          test -f build/web/flutter_service_worker.js
          grep -q "DoseGPT" build/web/manifest.json
          grep -q "flutter-first-frame" build/web/index.html
          grep -q "Inter-Variable.ttf" build/web/assets/FontManifest.json
          grep -q "NotoSansEthiopic-Variable.ttf" build/web/assets/FontManifest.json
          echo "manifest, service worker and bundled fonts all present"