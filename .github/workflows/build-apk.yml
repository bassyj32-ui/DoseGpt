name: Build APK

# Android debug build.
#
# The artifact is signed with the throwaway debug keystore, which is why it
# installs on any handset. A `flutter build apk --release` with no signing
# config produces an APK Android refuses to install, so switching to
# --release is not a free change — it needs a real keystore first.
#
# This app is not clinically verified. Do not hand the APK to a health worker
# on the strength of it being installable. See README.
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dosegpt-debug-apk-UNVERIFIED
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14