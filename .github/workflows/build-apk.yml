name: Build & Deploy

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # DEBUG BUILD — NOT FOR DISTRIBUTION.
      #
      # The artifact is signed with the throwaway debug keystore, which is
      # why it installs on any handset. A `flutter build apk --release` with
      # no signing config produces an APK that Android refuses to install, so
      # the debug build is deliberate until a real keystore is provisioned.
      #
      # This app is not clinically verified. Do not distribute the APK to
      # health workers on the strength of it being installable. See README.
      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dosegpt-debug-apk-UNVERIFIED
          path: build/app/outputs/flutter-apk/*.apk

  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --dir=build/web --prod --message="Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}